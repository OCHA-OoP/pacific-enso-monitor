<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pacific Regional El Niño Monitoring 2026</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
<style>
    body { margin: 0; padding: 0; background: #eef1f6; font-family: 'Open Sans', Arial, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    
    /* Map Title Overlay */
    #map-title {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.95);
        padding: 15px 25px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        z-index: 1000;
        border-left: 6px solid #C5192D;
    }
    #map-title h1 { margin: 0; font-size: 22px; color: #222; letter-spacing: -0.5px; }
    #map-title p { margin: 5px 0 0 0; font-size: 13px; color: #666; text-transform: uppercase; font-weight: bold; }

    /* Popup General Styling */
    .mapboxgl-popup { max-width: 340px; }
    .mapboxgl-popup-content { border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); padding: 15px; }
    
    /* Standout Labels */
    .info-box { background: #f4f7fb; border: 1px solid #e1e8f0; border-radius: 6px; padding: 10px; margin-bottom: 10px; text-align: left; }
    .info-label { font-size: 11px; text-transform: uppercase; color: #777; font-weight: bold; display: block; margin-bottom: 2px; }
    .info-value { font-size: 18px; font-weight: 800; color: #222; }
    
    /* ENSO Meter CSS Graphic */
    .meter-container { position: relative; width: 220px; height: 110px; overflow: hidden; margin: 20px auto 5px; }
    .meter-arc { 
        width: 220px; height: 220px; border-radius: 50%; 
        background: conic-gradient(from 270deg, 
            #245195 0 25deg,     /* La Nina */
            #B5CBE6 25deg 51deg, /* Alert */
            #DCE5F1 51deg 77deg, /* Watch */
            #A8D18D 77deg 103deg,/* Neutral */
            #FCE4D6 103deg 129deg,/* Watch */
            #ED7D31 129deg 155deg,/* Alert/Advisory */
            #C5192D 155deg 180deg,/* El Nino */
            transparent 180deg 360deg);
    }
    .meter-cutout { position: absolute; top: 35px; left: 35px; width: 150px; height: 150px; background: white; border-radius: 50%; }
    
    /* Meter Labels */
    .meter-label { position: absolute; font-size: 10px; font-weight: 800; color: white; letter-spacing: 0.5px;}
    .label-left { top: 65px; left: 12px; transform: rotate(-50deg); }
    .label-center { top: 15px; left: 83px; color: #444; }
    .label-right { top: 65px; right: 12px; transform: rotate(50deg); }
    
    /* Dynamic Needle */
    .meter-needle { 
        position: absolute; bottom: 0px; left: 108px; width: 4px; height: 95px; 
        background: #111; transform-origin: bottom center; border-radius: 4px; 
        transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 5;
    }
    .meter-pivot { position: absolute; bottom: -8px; left: 102px; width: 16px; height: 16px; background: #111; border-radius: 50%; z-index: 10; }
</style>
</head>
<body>

<div id="map-title">
    <h1>Pacific Regional El Niño Monitoring</h1>
    <p>2026 Advisory Dashboard</p>
</div>

<div id="map"></div>

<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibmVtYWlha290bzIwMjQiLCJhIjoiY2x5ODRmdmVqMGJpajJrcTZ0Z2p3YjZmMiJ9.1WaNl8YlKy68xDRh5FYRLA';
    
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/nemaiakoto2024/cmqq2wfqj000i01t0397p5hgz', 
        center: [160, -5], // Adjusted to precisely match your screenshot view
        zoom: 3.2,         // Pulled back slightly to encompass all islands
        projection: 'mercator'
    });

    map.on('load', () => {
        
        const layerID = '2bba9652e4252c93e87d'; 
        
        // --- 1. AGGRESSIVELY HIDE ALL DEFAULT LABELS ---
        // Loops through every layer and permanently disables default cities, countries, and marine labels
        const layers = map.getStyle().layers;
        for (const layer of layers) {
            if (layer.type === 'symbol' && layer.id !== layerID && !layer.id.includes('pacific-text')) {
                map.setLayoutProperty(layer.id, 'visibility', 'none');
            }
        }

        // --- 2. DYNAMICALLY ADD STYLED PERMANENT TEXT LABELS ---
        const dotLayer = map.getLayer(layerID);
        if (dotLayer) {
            map.addLayer({
                'id': 'pacific-text-labels',
                'type': 'symbol',
                'source': dotLayer.source,
                'source-layer': dotLayer.sourceLayer,
                'layout': {
                    // Uses Mapbox expressions to size the country name larger than the status
                    'text-field': [
                        'format',
                        ['upcase', ['coalesce', ['get', 'country'], ['get', 'Country'], '']], { 'font-scale': 1.1 },
                        '\nSTATUS: ', { 'font-scale': 0.75 },
                        ['upcase', ['coalesce', ['get', 'current_status'], ['get', 'Current_Status'], '']], { 'font-scale': 0.85 }
                    ],
                    'text-anchor': 'top',
                    'text-offset': [0, 0.8], 
                    'text-justify': 'center'
                },
                'paint': {
                    // This color-codes the map text exactly like the dots based on OCHA severity
                    'text-color': [
                        'match',
                        ['get', 'current_status'],
                        'El Niño', '#C5192D',
                        'El Nino', '#C5192D',
                        'Watch', '#F26A21',
                        'Advisory', '#F9A41A',
                        'Alert', '#F9A41A',
                        'Neutral', '#418FDE',
                        '#333333'
                    ],
                    'text-halo-color': '#ffffff',
                    'text-halo-width': 2.5
                }
            });
        }

        // Group both the dots and the new labels so clicking either one opens the popup
        const interactiveLayers = [layerID, 'pacific-text-labels'];

        // --- 3. POPUP LOGIC ---
        map.on('click', interactiveLayers, (e) => {
            const coordinates = e.features[0].geometry.coordinates.slice();
            const props = e.features[0].properties;

            const country = props.country || props.Country || 'Unknown Country';
            const status = props.current_status || props.Current_Status || 'Unknown Status';
            const dateUpdated = props.current_date || props.Current_Date || 'Unknown Date';
            const comments = props.comments || props.Comments || '';

            // Calculate the needle rotation and text color based on the status
            let needleAngle = 0; // Default Neutral
            let textHighlight = '#A8D18D'; 
            let statusBackground = '#eef7ed';

            if (status.includes('El Niño') || status.includes('El Nino')) {
                needleAngle = 77; // Red zone
                textHighlight = '#C5192D';
                statusBackground = '#faebeb';
            } else if (status.includes('Advisory') || status.includes('Alert')) {
                needleAngle = 52; // Yellow/Orange zone
                textHighlight = '#F9A41A';
                statusBackground = '#fef8e6';
            } else if (status.includes('Watch')) {
                needleAngle = 26; // Orange zone
                textHighlight = '#F26A21'; 
                statusBackground = '#fdefeb';
            } else if (status.includes('La Niña') || status.includes('La Nina')) {
                needleAngle = -77; // Dark Blue zone
                textHighlight = '#245195'; 
                statusBackground = '#eaeff5';
            }

            // Construct the popup with Standout Labels and the Embedded CSS Meter
            const description = `
                <div style="text-align: center;">
                    
                    <div class="info-box">
                        <span class="info-label">Country Name</span>
                        <span class="info-value">${country}</span>
                    </div>

                    <div class="info-box" style="background: ${statusBackground}; border-color: ${textHighlight}; border-left: 5px solid ${textHighlight};">
                        <span class="info-label" style="color: ${textHighlight};">Current Status</span>
                        <span class="info-value" style="color: ${textHighlight}; text-transform: uppercase;">${status}</span>
                    </div>
                    
                    <div class="meter-container">
                        <div class="meter-arc"></div>
                        <div class="meter-cutout"></div>
                        <span class="meter-label label-left">LA NIÑA</span>
                        <span class="meter-label label-center">NEUTRAL</span>
                        <span class="meter-label label-right">EL NIÑO</span>
                        <div class="meter-pivot"></div>
                        <div class="meter-needle" style="transform: rotate(${needleAngle}deg);"></div>
                    </div>
                    
                    <p style="margin: -5px 0 10px 0; font-size: 11px; color: #888;">Updated: ${dateUpdated}</p>
                    
                    <p style="font-size: 13px; color: #444; text-align: left; border-top: 1px solid #eee; padding-top: 10px; line-height: 1.5;">
                        ${comments ? comments : 'No specific impacts reported at this time.'}
                    </p>
                </div>
            `;

            while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
            }

            new mapboxgl.Popup()
                .setLngLat(coordinates)
                .setHTML(description)
                .addTo(map);
        });

        map.on('mouseenter', interactiveLayers, () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', interactiveLayers, () => { map.getCanvas().style.cursor = ''; });
    });
</script>

</body>
</html>
